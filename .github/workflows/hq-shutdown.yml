# Shuts HQ down: deletes the DigitalOcean app products-hq and its database
# cluster products-hq-db, and HQ's own Stripe and Cal.com webhooks. See
# scripts/hq-shutdown.mjs and RESTART.md.
# Without "DELETE" typed in, it only lists what it would remove. Deleting also
# needs a successful "HQ snapshot" check, in the last 7 days, of the backup that
# SNAPSHOT_REQUEST in src/ops/snapshot.ts names.
name: HQ shutdown
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove HQ for real (anything else is a dry run)'
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check the backup was made and checked
        if: inputs.confirm == 'DELETE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The backup HQ was asked to make (src/ops/snapshot.ts), and a successful "HQ snapshot" check of exactly that one.
          id=$(grep -oE '^export const SNAPSHOT_REQUEST = "hq-snapshot-[0-9]{8}-[0-9]{4}"' src/ops/snapshot.ts | grep -oE 'hq-snapshot-[0-9]{8}-[0-9]{4}' || true)
          [ -n "$id" ] || { echo "SNAPSHOT_REQUEST in src/ops/snapshot.ts names no backup: HQ hasn't been asked to make one."; exit 1; }
          gh run list --repo "$GITHUB_REPOSITORY" --workflow hq-snapshot.yml --status success --limit 50 --json displayTitle,createdAt,url \
            | jq --arg id "$id" '[.[] | select(.displayTitle == "HQ snapshot check " + $id)][0] // empty' > last.json
          [ -s last.json ] || { echo "No successful HQ snapshot check of $id yet: run that first."; exit 1; }
          when=$(jq -r .createdAt last.json)
          age=$(( ( $(date +%s) - $(date -d "$when" +%s) ) / 86400 ))
          echo "Backup $id was checked on $when ($(jq -r .url last.json))."
          [ "$age" -le 7 ] || { echo "That check is $age days old: take a fresh backup first."; exit 1; }
      - name: Shut down
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CALCOM_API_KEY: ${{ secrets.CALCOM_API_KEY }}
        run: node scripts/hq-shutdown.mjs ${{ inputs.confirm == 'DELETE' && '--delete' || '' }}
