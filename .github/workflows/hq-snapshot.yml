# Checks an HQ backup. HQ makes its backups itself (src/ops/snapshot.ts: set
# SNAPSHOT_REQUEST and deploy) and emails them, in 15 MB parts, to its own
# mailbox (info@felixclarke.com), because its database can only be reached from
# inside the app and the repo is public.
# This reads the parts back from the mailbox, checks the checksum, restores the
# backup into a throwaway database and compares every row count. Only emails the
# mailbox sent itself count (Sent Mail, from its own address). A successful run
# for the backup named in SNAPSHOT_REQUEST is what "HQ shutdown" needs before it
# deletes anything.
# Only sizes, checksums, table names and row counts are printed; never contact data.
name: HQ snapshot
run-name: HQ snapshot check ${{ inputs.snapshot }}
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Backup name, exactly as HQ logged it, e.g. hq-snapshot-20261106-1440'
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Read the backup from the mailbox and restore it into a test database
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPLY_MAILBOX: ${{ secrets.REPLY_MAILBOX }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT" =~ ^hq-snapshot-[0-9]{8}-[0-9]{4}$ ]] || { echo "Give the backup's exact name, e.g. hq-snapshot-20261106-1440."; exit 1; }
          npx tsx scripts/hq-snapshot.ts fetch "$SNAPSHOT" backup.dump
          export PGHOST=localhost PGUSER=postgres PGPASSWORD=test PGDATABASE=restore PGOPTIONS='-c search_path=app,public'
          /usr/lib/postgresql/16/bin/pg_restore --no-owner --no-acl --exit-on-error --single-transaction -d restore backup.dump
          rm -f backup.dump
          bad=0; n=0
          while read -r t want; do
            got=$(psql -Atc "SELECT count(*) FROM \"$t\"" 2>/dev/null || echo missing)
            n=$((n + 1))
            if [ "$got" = "$want" ]; then echo "  $t: $got rows, matches"; else echo "  $t: $got rows, backup says $want"; bad=1; fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value)"' backup.dump.counts.json)
          echo "Other tables (changing while the backup ran):"
          psql -At -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'app' AND table_type = 'BASE TABLE' ORDER BY 1" \
            | while read -r t; do jq -e --arg t "$t" 'has($t)' backup.dump.counts.json > /dev/null || echo "  $t: $(psql -Atc "SELECT count(*) FROM \"$t\"") rows"; done
          [ "$n" -gt 0 ] || { echo "The backup has no row counts to check."; exit 1; }
          [ "$bad" = 0 ] || { echo "The restored copy doesn't match the backup."; exit 1; }
          echo "The backup restores cleanly: it is safe to shut HQ down."
