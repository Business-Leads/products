# Shows where Awaz (Speed to Lead) sends its call webhook, and with "DELETE"
# removes it when it goes to HQ (deleted 6 Nov 2026) or to the Make scenario
# "Watch Calls" that forwarded calls to HQ. Awaz has one call webhook per account
# (public API: GET and DELETE /v1/hooks/calls, from api.awaz.ai/docs-json).
# Prints only the webhook's host, never its token. To restart, see RESTART.md.
name: Awaz hooks
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove the HQ or Make call webhook (anything else only shows it)'
        default: ""
permissions: {}
jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Awaz call webhook
        env:
          KEY: ${{ secrets.AWAZ_API_KEY }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -uo pipefail
          api=https://api.awaz.ai/v1/hooks/calls
          show() {
            out=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $KEY" -H "Accept: application/json" "$api")
            code=$(tail -n1 <<<"$out"); body=$(sed '$d' <<<"$out")
            # The reply is a list of webhooks, bare or inside items/data/hooks; take the first.
            url=$(jq -r '(if type == "array" then . elif (.items // .data // .hooks) != null then (.items // .data // .hooks) else [.] end)
                         | map(.url // .hookUrl // empty) | first // empty' <<<"$body" 2>/dev/null)
            echo "  reply shape: $(jq -c 'if type == "object" then keys else type end' <<<"$body" 2>/dev/null)"
            echo "GET /v1/hooks/calls: $code, webhook host: $( [ -n "$url" ] && sed -E 's#^https?://##; s#/.*##' <<<"$url" || echo none)"
          }
          show
          if [ "$CONFIRM" = "DELETE" ] && [ -n "$url" ]; then
            if grep -qE 'onlinebusinessbuilder\.co\.uk|ondigitalocean\.app|account\.speedtolead\.co\.uk|make\.com' <<<"$url"; then
              del=$(jq -n --arg u "$url" '{hookUrl: $u}' | curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d @- "$api")
              echo "DELETE /v1/hooks/calls: $del"
              show
            else
              echo "The webhook goes somewhere else, so it was left alone."
            fi
          fi
