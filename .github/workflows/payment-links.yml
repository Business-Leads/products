# One-off (6 Nov 2026): archives the unused Stripe product and price left by a
# refused payment-link attempt (scripts/stripe-tidy.mjs). To be removed after use.
name: Payment links
on:
  workflow_dispatch:
    inputs:
      create:
        description: "Archive (otherwise only lists)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tidy
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node scripts/stripe-tidy.mjs ${{ inputs.create && '--archive' || '' }}
