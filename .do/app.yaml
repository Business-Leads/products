# DigitalOcean App Platform spec, sized for minimum cost:
#   web: apps-s-1vcpu-0.5gb (about $5/month)
#   db:  managed Postgres, smallest size (about $15/month)
# Deployed by scripts/deploy.sh, which fills in the secrets from the environment.
name: products-hq
region: lon
domains:
  - domain: hq.onlinebusinessbuilder.co.uk
    type: PRIMARY
  # Client account areas, one per product site (see src/portal/).
  - domain: account.linkn.co.uk
    type: ALIAS
  - domain: account.speedtolead.co.uk
    type: ALIAS
  - domain: account.goodquestions.co.uk
    type: ALIAS
  - domain: account.onlinebusinessbuilder.co.uk
    type: ALIAS
  # emailfirst.co.uk's DNS is in Cloudflare, so its CNAME is added there by hand.
  - domain: account.emailfirst.co.uk
    type: ALIAS
services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: Business-Leads/products
      branch: claude/sharp-mayer-p52klq
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: ALERT_EMAIL
        scope: RUN_TIME
        value: info@felixclarke.com
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_URL
        scope: RUN_TIME
        type: SECRET
      - key: IMAP_URL
        scope: RUN_TIME
        type: SECRET
      - key: REPLY_TO
        scope: RUN_TIME
        type: SECRET
      - key: IMAP_FOLDER
        scope: RUN_TIME
        type: SECRET
      - key: NETLIFY_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: GODADDY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GODADDY_API_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: MAILWIZZ_API_URL
        scope: RUN_TIME
        type: SECRET
      - key: MAILWIZZ_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AWAZ_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AWAZ_TEST_AGENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: AWAZ_TEST_FROM_ID
        scope: RUN_TIME
        type: SECRET
      - key: EF_FROM_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: GQ_FROM_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: LOCALFALCON_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GBP_MANAGER_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: FEEDBOSS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SCOREAPP_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SBL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SBL_WEBHOOK_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: AWAZ_WEBHOOK_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: CALCOM_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: CALCOM_WEBHOOK_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: SBL_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SBL_COMPANY_ID
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CLAUDE_MONTHLY_BUDGET_USD
        scope: RUN_TIME
        value: "20"
      - key: PORTAL_DOMAINS
        scope: RUN_TIME
        value: "linkn,speedtolead,goodquestions,onlinebusinessbuilder,emailfirst"
databases:
  # A small managed cluster (created by scripts/deploy.mjs if missing). The
  # cheaper "dev database" doesn't let the app create tables on Postgres 15+.
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: products-hq-db
